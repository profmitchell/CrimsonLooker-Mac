name: Build CrimsonLooker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and ad-hoc sign
        run: ./build.sh

      - name: Inspect dylib
        run: |
          file build/CrimsonLooker.dylib
          lipo -archs build/CrimsonLooker.dylib
          codesign --verify --verbose=2 build/CrimsonLooker.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonLooker-arm64
          path: build/CrimsonLooker.dylib
